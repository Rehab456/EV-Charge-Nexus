
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Welcome | EVCharge Nexus</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #071522;
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: #18b987;
            filter: blur(170px);
            opacity: 0.09;
            top: -250px;
            right: -180px;
            pointer-events: none;
        }

        .welcome-container {
            width: min(90%, 500px);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn .7s ease both;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -.8px;
            margin-bottom: 60px;
        }

        .logo-icon {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            background: #39dba6;
            color: #071522;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .logo span {
            color: #39dba6;
        }

        .success-icon {
            width: 92px;
            height: 92px;
            margin: 0 auto 32px;
            border-radius: 50%;
            background: rgba(57, 219, 166, .12);
            border: 1px solid rgba(57, 219, 166, .35);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(57, 219, 166, .12);
            animation: pop .65s ease both;
        }

        .success-icon svg {
            width: 44px;
            height: 44px;
            stroke: #39dba6;
        }

        .status {
            color: #39dba6;
            font-size: 12px;
            letter-spacing: 2.5px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(30px, 5vw, 44px);
            line-height: 1.25;
            margin: 0 0 18px;
            letter-spacing: -1.4px;
            font-weight: 750;
        }

        h1 span {
            color: #39dba6;
            overflow-wrap: anywhere;
        }

        .subtitle {
            color: #9aafbf;
            font-size: 15px;
            line-height: 1.8;
            margin: 0;
        }

        .progress-track {
            height: 5px;
            background: #1c3544;
            border-radius: 20px;
            overflow: hidden;
            margin: 40px auto 22px;
            max-width: 320px;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(
                90deg, #16b987, #61f5c4
            );
            border-radius: inherit;
            animation: loading 2.7s linear forwards;
        }

        .secure-note {
            color: #7893a5;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .secure-note svg {
            width: 15px;
            height: 15px;
            stroke: #39dba6;
        }

        @keyframes loading {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.65);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="welcome-container">

        <div class="logo">
            <div class="logo-icon">⚡</div>
            <div>
                EVCharge <span>Nexus</span>
            </div>
        </div>

        <div class="success-icon">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke-width="2.5"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M5 12l4 4L19 6"/>
            </svg>
        </div>

        <div class="status">
            LOGIN SUCCESSFUL
        </div>

        <h1>
            Welcome back,<br>
            <span>{{ user_name }}</span>!
        </h1>

        <p class="subtitle">
            Your journey starts here.<br>
            Preparing your EVCharge Nexus dashboard...
        </p>

        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>

        <div class="secure-note">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
            Secure sign-in completed
        </div>

    </main>

    <script>
        const dashboardUrl = {{ url_for("dashboard") | tojson }};

        setTimeout(function () {
            window.location.replace(dashboardUrl);
        }, 2700);
    </script>
</body>
</html>
